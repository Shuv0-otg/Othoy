<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>অথৈ – সমোচ্চারিত ভিন্নার্থক শব্দ</title>
<meta name="description" content="অথৈ: বিশ্ববিদ্যালয় ভর্তি পরীক্ষার বাংলা প্রস্তুতি।"><meta name="theme-color" content="#12786a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe6;--sf:#fffdf8;--sf2:#efe6d8;--ink:#1e1916;--mut:#6d6258;--ln:#e3d7c6;--pr:#7c2f45;--pr2:#5e2234;--prt:#f8e8ec;--gold:#8d6230;--gt:#f8ecd8;--ok:#1d6b45;--okt:#e5f5ec;--bad:#a33b32;--badt:#fbeceb;--sh:0 1px 2px rgba(30,25,22,.05),0 10px 28px -16px rgba(30,25,22,.22);--on:#fff8f6;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14110f;--sf:#1e1a17;--sf2:#2a2420;--ink:#f6efe8;--mut:#b3a69c;--ln:#3a322c;--pr:#e0a3ad;--pr2:#f0c2c8;--prt:#3a2428;--gold:#e4c07a;--gt:#3a2e1c;--ok:#8fd0ae;--okt:#163028;--bad:#f0b0a8;--badt:#3d221f;--sh:0 1px 2px rgba(0,0,0,.4);--on:#2a1216;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14110f;--sf:#1e1a17;--sf2:#2a2420;--ink:#f6efe8;--mut:#b3a69c;--ln:#3a322c;--pr:#e0a3ad;--pr2:#f0c2c8;--prt:#3a2428;--gold:#e4c07a;--gt:#3a2e1c;--ok:#8fd0ae;--okt:#163028;--bad:#f0b0a8;--badt:#3d221f;--sh:0 1px 2px rgba(0,0,0,.4);--on:#2a1216;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Hind Siliguri",system-ui,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.wrap{max-width:920px;margin:0 auto;padding:16px 16px 96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
header.top>div{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 16px}
.logo{font:600 24px "Tiro Bangla",Georgia,serif;letter-spacing:.2px;margin-right:auto;cursor:pointer;display:flex;gap:8px;align-items:center}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--pr);color:var(--on);display:grid;place-items:center;font:italic 600 18px "Tiro Bangla",serif}
nav.d{display:flex;gap:2px}nav.d a,nav.m a{padding:8px 12px;border-radius:10px;color:var(--mut);text-decoration:none;font-weight:500;font-size:15px}
nav.d a:hover{background:var(--sf2)}nav a.on{color:var(--pr);background:var(--prt)}
nav.m{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sf);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.m a{flex:1;text-align:center;font-size:14px;font-weight:600;line-height:1.2;padding:8px 2px;min-height:48px;display:flex;align-items:center;justify-content:center}
a.logo{color:inherit;text-decoration:none}.ib{border:1px solid var(--ln);background:var(--sf);border-radius:10px;width:38px;height:38px;display:grid;place-items:center}
h1,h2,h3{font-family:"Tiro Bangla",Georgia,serif;font-weight:600;margin:0}
.hero{padding:28px 0 8px}.hero h1{font-size:clamp(32px,6vw,52px);line-height:1.08;max-width:20ch;text-wrap:balance}.hero p{color:var(--mut);max-width:52ch;margin:12px 0 0;font-size:17px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-top:20px}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:18px;text-align:left;box-shadow:var(--sh);transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--pr)}.tile h3{font-size:21px;margin:8px 0 4px}.tile p{margin:0;color:var(--mut);font-size:14px}.tile svg{width:26px;height:26px;color:var(--pr)}
.tile:disabled{opacity:.6;cursor:not-allowed}.tile:disabled:hover{transform:none;border-color:var(--ln)}.tile.pri{background:var(--pr);border-color:var(--pr);color:var(--on)}.tile.pri p,.tile.pri svg{color:var(--on)}.tile.pri p{opacity:.92}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.stat{flex:1;min-width:120px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 14px}.stat b{display:block;font:600 28px "Tiro Bangla",serif}.stat span{color:var(--mut);font-size:13px}
.bar{height:6px;background:var(--sf2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr);border-radius:9px;transition:width .3s}
.bar.lg{height:8px}
.btn{border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:10px 16px;font-weight:600;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn:hover{border-color:var(--pr)}.btn.p{background:var(--pr);color:var(--on);border-color:var(--pr)}.btn.p:hover{background:var(--pr2)}.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:500;color:var(--mut)}
.chip svg,.ans svg{width:18px;height:18px;flex:none}.ans.hid svg{vertical-align:-4px;margin-right:4px}.chip.on{background:var(--prt);color:var(--pr);border-color:var(--pr)}
.chip[disabled]{opacity:.35}
input[type=search],input[type=number],input.t,select{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;min-height:42px}
input[type=search]{flex:1;min-width:160px}
.az{display:flex;gap:4px;flex-wrap:wrap;margin:12px 0}.az button{width:32px;height:32px;border-radius:9px;border:1px solid var(--ln);background:var(--sf);font-weight:600;font-size:13px;color:var(--mut)}.az button.on{background:var(--pr);color:var(--on);border-color:var(--pr)}.az button:disabled{opacity:.3;cursor:default}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:22px;box-shadow:var(--sh);margin-top:14px}
.badge{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--gt);color:var(--gold)}.badge.K{background:var(--prt);color:var(--pr)}.eyebrow{margin:0 0 6px;font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--pr)}.stem u,.tq u{text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--pr)}
.no{color:var(--mut);font-size:13px}
.hw{font-size:clamp(34px,8vw,56px);line-height:1.1;margin:14px 0 4px;word-break:break-word;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stem{color:var(--mut);margin:4px 0 14px;font-size:16px}
.ans{border-radius:14px;padding:14px 16px;background:var(--okt);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}.ans small{color:var(--ok);font-weight:600;display:block}.ans b{font:600 26px "Tiro Bangla",serif;color:var(--ok)}
.ans.hid{background:var(--sf2);border:1px dashed var(--ln);text-align:center;cursor:pointer;color:var(--mut)}
.oth{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.oth span{background:var(--sf2);border-radius:9px;padding:3px 10px;font-size:14px;color:var(--mut)}
.bn{margin-top:14px;padding-top:14px;border-top:1px dashed var(--ln)}.bn label{font-size:13px;color:var(--mut);display:block;margin-bottom:6px}.bn input{width:100%;font-family:"Hind Siliguri",sans-serif}.bn a{font-size:13px;color:var(--pr)}
.ico{border:1px solid var(--ln);background:var(--sf);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;color:var(--mut)}.ico.on{color:var(--gold);border-color:var(--gold);background:var(--gt)}.ico.ok.on{color:var(--ok);border-color:var(--ok);background:var(--okt)}
.ico svg,.ib svg{width:19px;height:19px}
.pg{display:flex;align-items:center;gap:10px;margin-top:14px}.pg .bar{flex:1}
h2.s{font-size:26px;margin:22px 0 6px}.mut{color:var(--mut)}
.sets{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin-top:12px}
.set{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;text-align:left}.set:hover{border-color:var(--pr)}.set b{font:600 19px "Tiro Bangla",serif;display:block}.set span{font-size:13px;color:var(--mut)}.set em{font-style:normal;font-size:12px;color:var(--ok);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:12px;overflow:hidden;background:var(--sf)}.seg button{border:0;background:none;padding:8px 14px;font-weight:600;color:var(--mut)}.seg button.on{background:var(--pr);color:var(--on)}
.cnt{display:flex;align-items:center;gap:8px}.cnt input{width:90px;text-align:center;font-size:22px;font-weight:600}
.tq{font:600 clamp(24px,5vw,34px)/1.25 "Tiro Bangla",Georgia,serif;margin:6px 0 16px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--sf);border:1.5px solid var(--ln);border-radius:14px;padding:13px 14px;margin-bottom:10px;font-size:17px;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--pr)}.opt i{font-style:normal;width:28px;height:28px;border-radius:8px;background:var(--sf2);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:var(--mut)}
.opt.ok{background:var(--okt);border-color:var(--ok)}.opt.ok i{background:var(--ok);color:var(--on)}.opt.no{background:var(--badt);border-color:var(--bad)}.opt.no i{background:var(--bad);color:var(--on)}.opt:disabled{cursor:default}
.fb{padding:10px 14px;border-radius:12px;font-weight:600;margin:4px 0 10px}.fb.ok{background:var(--okt);color:var(--ok)}.fb.no{background:var(--badt);color:var(--bad)}.fb small{display:block;font-weight:400;color:var(--mut)}
.nv{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}.nv button{width:34px;height:34px;border-radius:9px;border:1px solid var(--ln);background:var(--sf);font-size:13px;font-weight:600;color:var(--mut)}.nv .c{background:var(--ok);color:var(--on);border-color:var(--ok)}.nv .w{background:var(--bad);color:var(--on);border-color:var(--bad)}.nv .cur{outline:2px solid var(--pr);outline-offset:1px}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--sf2) 0)}.ring div{width:118px;height:118px;border-radius:50%;background:var(--sf);display:grid;place-items:center;font:600 34px "Tiro Bangla",serif}
.rv{background:var(--sf);border:1px solid var(--ln);border-left:4px solid var(--ok);border-radius:12px;padding:12px 14px;margin-top:10px}.rv.w{border-left-color:var(--bad)}.rv b{font-weight:600}.rv .mut{font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 6px;border-bottom:1px solid var(--ln);text-align:left}th{color:var(--mut);font-weight:500}
.scr{overflow-x:auto}
dialog{border:1px solid var(--ln);border-radius:18px;background:var(--sf);color:var(--ink);padding:0;width:min(560px,94vw);max-height:80vh}dialog::backdrop{background:rgba(0,0,0,.5)}dialog .h{padding:14px 16px;border-bottom:1px solid var(--ln);display:flex;align-items:center}dialog .b{overflow:auto;max-height:60vh;padding:6px}
.li{display:flex;width:100%;gap:10px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:10px}.li:hover,.li.on{background:var(--prt)}.li b{font-weight:600}.li span{color:var(--mut);margin-left:auto;font-size:13px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;z-index:50}
@media(max-width:720px){nav.d{display:none}nav.m{display:flex}.wrap{padding-bottom:110px}.logo{font-size:21px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.hr{display:flex;align-items:center;gap:8px}a.all{font-size:13px;font-weight:600;color:var(--pr);text-decoration:none;border:1px solid var(--ln);background:var(--sf);padding:8px 12px;border-radius:10px;white-space:nowrap}
/* shared */
.opt.ok{animation:pop .35s}.opt.no{animation:shk .35s}
@keyframes pop{50%{transform:scale(1.03)}}@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:99;pointer-events:none;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
/* theme switch */
.tsw{position:relative;display:grid;grid-template-columns:repeat(3,32px);padding:3px;border-radius:99px;border:1px solid var(--ln);background:var(--sf)}
.tsw::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:32px;border-radius:99px;background:var(--pr);transform:translateX(calc(var(--i,1)*100%));transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.tsw button{position:relative;z-index:1;height:30px;border:0;background:none;display:grid;place-items:center;color:var(--mut);transition:color .2s}
.tsw button.on{color:var(--on)}.tsw svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:420px){a.all{padding:8px 10px;font-size:12.5px}}
/* vivid theme (my style) */
:root[data-theme=vivid]{--bg:#140711;--sf:rgba(255,255,255,.07);--sf2:rgba(255,255,255,.11);--ink:#f5f2ff;--mut:#b9b1de;--ln:rgba(255,255,255,.17);--pr:#f0a6bc;--pr2:#e0457b;--prt:rgba(240,166,188,.2);--gold:#fcd34d;--gt:rgba(252,211,77,.16);--ok:#34d399;--okt:rgba(52,211,153,.17);--bad:#fb7185;--badt:rgba(251,113,133,.17);--sh:0 14px 40px -16px rgba(0,0,0,.75);--on:#140711;color-scheme:dark}
[data-theme=vivid] body{background:var(--bg)}
[data-theme=vivid] body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(40% 35% at 18% 14%,rgba(224,69,123,.5),transparent 70%),radial-gradient(34% 30% at 88% 22%,rgba(245,158,11,.34),transparent 70%),radial-gradient(40% 36% at 68% 92%,rgba(139,92,246,.34),transparent 70%);animation:aur 20s ease-in-out infinite alternate}
@keyframes aur{to{transform:translate3d(-5%,4%,0) rotate(7deg) scale(1.12)}}
[data-theme=vivid] header.top,[data-theme=vivid] nav.m{background:rgba(20,7,17,.62);backdrop-filter:blur(16px)}
[data-theme=vivid] .card,[data-theme=vivid] .stat,[data-theme=vivid] .opt,[data-theme=vivid] .chip,[data-theme=vivid] .btn,[data-theme=vivid] .tt,[data-theme=vivid] .cnt input,[data-theme=vivid] .ico{backdrop-filter:blur(10px)}
[data-theme=vivid] h1,[data-theme=vivid] h2,[data-theme=vivid] h3,[data-theme=vivid] .logo,[data-theme=vivid] .tq{font-family:"Hind Siliguri",system-ui,sans-serif}
[data-theme=vivid] .mxh h2,[data-theme=vivid] h2.s{background:linear-gradient(90deg,#fff 10%,#ffd1dc 50%,#fcd34d);-webkit-background-clip:text;background-clip:text;color:transparent}
[data-theme=vivid] .logo i,[data-theme=vivid] .tsw::before{background:linear-gradient(135deg,#e0457b,#f59e0b);color:#fff}
[data-theme=vivid] .tsw button.on{color:#fff}
[data-theme=vivid] .btn.p{background:linear-gradient(135deg,#e0457b,#f59e0b);color:#fff;border:0;box-shadow:0 10px 28px -10px rgba(224,69,123,.9);position:relative;overflow:hidden}
[data-theme=vivid] .btn.p:not(:disabled):hover{filter:brightness(1.1);transform:translateY(-1px)}
[data-theme=vivid] .btn.p:disabled{opacity:.4;box-shadow:none}
[data-theme=vivid] #go:not(:disabled){animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 10px 34px -4px rgba(245,158,11,.8)}}
[data-theme=vivid] .chip.on{background:linear-gradient(135deg,rgba(224,69,123,.5),rgba(245,158,11,.35));border-color:rgba(240,166,188,.7);color:#fff}
[data-theme=vivid] .bar i{background:linear-gradient(90deg,#e0457b,#f59e0b,#34d399)}
[data-theme=vivid] .ring{background:conic-gradient(#f59e0b calc(var(--p)*1%),rgba(255,255,255,.12) 0);box-shadow:0 0 40px -8px rgba(245,158,11,.6)}
[data-theme=vivid] .opt:hover:not(:disabled){border-color:var(--pr);background:rgba(240,166,188,.14);transform:translateX(3px)}
[data-theme=vivid] .opt i{background:rgba(255,255,255,.12);color:#fff}
[data-theme=vivid] .nv button.cur{outline:2px solid #f59e0b}
[data-theme=vivid] a.all{background:rgba(255,255,255,.08)}
@media(prefers-reduced-motion:reduce){[data-theme=vivid] body::before,#go{animation:none!important}}

[data-theme=vivid] .tile,[data-theme=vivid] .set,[data-theme=vivid] .stat,[data-theme=vivid] table{backdrop-filter:blur(10px)}
[data-theme=vivid] .tile:hover,[data-theme=vivid] .set:hover{border-color:var(--pr);transform:translateY(-2px)}
[data-theme=vivid] .hero h1,[data-theme=vivid] .stat b{font-family:"Hind Siliguri",system-ui,sans-serif}
[data-theme=vivid] .hero h1{background:linear-gradient(90deg,#fff 10%,#ffd1dc 50%,#fcd34d);-webkit-background-clip:text;background-clip:text;color:transparent}
[data-theme=vivid] .eyebrow{color:#fcd34d}

/* colourful options */
.opt{--oc:var(--pr);position:relative;overflow:hidden}
.opt:nth-of-type(1){--oc:#a78bfa}.opt:nth-of-type(2){--oc:#22d3ee}.opt:nth-of-type(3){--oc:#fbbf24}.opt:nth-of-type(4){--oc:#f472b6}.opt:nth-of-type(5){--oc:#34d399}
.opt i{background:var(--oc)!important;color:#16122e!important;font-weight:800;font-style:normal;transition:transform .2s}
.opt:not(:disabled):hover{border-color:var(--oc)!important;background:color-mix(in srgb,var(--oc) 16%,var(--sf))!important;transform:translateX(4px)}
.opt:not(:disabled):active{transform:scale(.98)}.opt:not(:disabled):hover i{transform:scale(1.12) rotate(-6deg)}
.opt.ok{border-color:#22c55e!important;background:linear-gradient(90deg,rgba(34,197,94,.34),rgba(34,197,94,.1))!important;box-shadow:0 0 0 1px #22c55e inset,0 12px 28px -14px #22c55e}
.opt.ok i{background:#22c55e!important;color:#052e12!important}.opt.ok::after{content:"✓";margin-left:auto;font-weight:900;color:#22c55e;font-size:21px}
.opt.no{border-color:#ef4444!important;background:linear-gradient(90deg,rgba(239,68,68,.32),rgba(239,68,68,.08))!important;box-shadow:0 0 0 1px #ef4444 inset,0 12px 28px -14px #ef4444}
.opt.no i{background:#ef4444!important;color:#fff!important}.opt.no::after{content:"✕";margin-left:auto;font-weight:900;color:#ef4444;font-size:21px}
.opt:disabled:not(.ok):not(.no){opacity:.5}
.fb{font-weight:800;font-size:18px;border-radius:14px}.fb small{color:var(--ink)!important;font-weight:500}
.fb.ok{background:linear-gradient(135deg,rgba(34,197,94,.28),rgba(34,211,238,.14))!important;border:1px solid #22c55e;color:#22c55e!important}
.fb.no{background:linear-gradient(135deg,rgba(239,68,68,.28),rgba(251,146,60,.14))!important;border:1px solid #ef4444;color:#ef4444!important}
[data-theme=light] .fb.ok,[data-theme=light] .opt.ok::after{color:#15803d!important}[data-theme=light] .fb.no,[data-theme=light] .opt.no::after{color:#b91c1c!important}
.nv button.c{background:#22c55e!important;border-color:#22c55e!important;color:#052e12!important}.nv button.w{background:#ef4444!important;border-color:#ef4444!important;color:#fff!important}
/* header buttons + drawer */
.hb{width:38px;height:38px;flex:none;border-radius:12px;border:1px solid var(--ln);background:var(--sf);display:grid;place-items:center;color:var(--ink);margin-right:8px}
.hb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dov{position:fixed;inset:0;z-index:60;background:rgba(5,3,20,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}

.drw .dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.drw .dl{display:flex;align-items:center;gap:8px;font:600 22px "Tiro Bangla",Georgia,serif;color:var(--ink)}

.drw nav{display:flex;flex-direction:column;gap:4px}
.drw nav a{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;font-weight:600;color:var(--ink);text-decoration:none;transition:background .15s,transform .15s}

.drw nav a i{width:12px;height:12px;border-radius:50%;flex:none}
